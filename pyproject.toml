[project]
name = "upside-case-analyzer"
version = "0.1.0"
description = "Build an investor-grade upside-case analysis and one-page PDF from a pitch deck."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "numpy-financial>=1.0",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "Pillow>=10.4",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "resend>=2.0",
]

[tool.ruff]
line-length = 100
